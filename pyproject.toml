[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pharma-interactions"
version = "0.1.0"
description = "Transparent, explainable drug interaction rule engine"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Open-source contributors"}]
dependencies = []

[project.scripts]
pharma-interactions = "pharma_interactions.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
